<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contratti Sponsor JC21 — Ottantunocento</title>
<style>
  :root{
    --ink:#14181F;--ink2:#4A5462;--ink3:#7C8695;
    --bg:#F6F7F9;--card:#fff;--line:#E3E7ED;
    --acc:#1B4D8F;--acc-s:#EAF0F8;
    --ok:#1B7A44;--ok-s:#E7F4EC;
    --wr:#9A5B00;--wr-s:#FDF1DC;
    --st:#A82820;--st-s:#FBEAE8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);padding-bottom:60px;
    font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}
  header{background:var(--ink);color:#fff;padding:16px 0}
  header .wrap{display:flex;align-items:center;gap:12px}
  header h1{margin:0;font-size:17px;font-weight:650;flex:1}
  header small{display:block;font-size:12px;color:#A9B4C4;font-weight:400;margin-top:2px}
  .bar{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
  .bar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;min-height:44px;padding:10px 16px;border:1px solid var(--line);background:#fff;
    border-radius:999px;font:550 15px/1 inherit;color:var(--ink2);cursor:pointer}
  .tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .card h2{margin:0 0 4px;font-size:17px;font-weight:650}
  h3{margin:16px 0 8px;font-size:12.5px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
  .sub{font-size:13px;color:var(--ink2);margin:0 0 12px}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
  input,select,textarea{width:100%;min-height:44px;padding:10px 12px;font:400 16px/1.45 inherit;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:9px}
  textarea{min-height:120px;resize:vertical;font-size:15px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:480px){.row{grid-template-columns:1fr}}
  button{font:600 15px/1 inherit;min-height:44px;padding:12px 16px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  button.danger{background:transparent;border-color:var(--st-s);color:var(--st)}
  button.sm{min-height:38px;padding:9px 12px;font-size:14px}
  button:disabled{opacity:.45;cursor:default}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px}
  .p-ok{background:var(--ok-s);color:var(--ok)}.p-wr{background:var(--wr-s);color:var(--wr)}
  .p-st{background:var(--st-s);color:var(--st)}.p-mu{background:#EEF1F5;color:var(--ink3)}
  .alert{border-left:3px solid var(--st);background:var(--st-s);padding:12px 14px;border-radius:0 9px 9px 0;
    margin-bottom:10px;font-size:14.5px;line-height:1.5}
  .alert.w{border-left-color:var(--wr);background:var(--wr-s)}
  .alert.i{border-left-color:var(--acc);background:var(--acc-s)}
  .alert b{display:block;margin-bottom:2px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-bottom:12px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi b{display:block;font-size:21px;font-weight:650;letter-spacing:-.02em}
  .kpi span{font-size:12px;color:var(--ink3)}
  .it{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;overflow:hidden}
  .it-h{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;cursor:pointer}
  .it-h b{display:block;font-size:16px;font-weight:650}
  .it-h .m{font-size:13px;color:var(--ink2);margin-top:2px}
  .it-b{padding:0 16px 16px;border-top:1px solid var(--line)}
  .rw{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #F0F2F5}
  .rw:last-child{border-bottom:0}
  .rw .d{font-size:14.5px}.rw .d span{display:block;font-size:12.5px;color:var(--ink3)}
  .chk{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #F0F2F5}
  .chk input{width:22px;height:22px;min-height:22px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--ok)}
  .chk .t{flex:1;font-size:15px;line-height:1.45}
  .chk .t small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
  .chk.done .t{color:var(--ink3);text-decoration:line-through;text-decoration-color:#C9D0DA}
  .chk.done .t small{text-decoration:none}
  .cl{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#FCFCFD}
  .cl-h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .cl-n{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .cl-h input[type=text]{min-height:38px;font-size:15px;font-weight:600}
  .mv{display:flex;gap:4px}
  .mv button{min-height:32px;width:34px;padding:0;font-size:15px}
  .lock{background:var(--ok-s);border:1px solid #BFE3CD;border-radius:10px;padding:12px 14px;
    font-size:14px;line-height:1.5;color:#155F35;margin-bottom:12px}
  pre{white-space:pre-wrap;word-wrap:break-word;background:#F7F8FA;border:1px solid var(--line);border-radius:9px;
    padding:14px;font:400 13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;max-height:46vh;overflow:auto}
  dialog{border:0;border-radius:14px;padding:0;width:min(680px,calc(100vw - 24px));max-height:88vh}
  dialog::backdrop{background:rgba(20,24,31,.55)}
  .dlg{padding:18px;overflow-y:auto;max-height:88vh}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,90px);background:var(--ink);color:#fff;
    padding:12px 20px;border-radius:999px;font-size:14.5px;font-weight:600;opacity:0;
    transition:.25s;z-index:99;pointer-events:none;max-width:90vw;text-align:center}
  .toast.on{transform:translate(-50%,0);opacity:1}
  .empty{text-align:center;padding:34px 18px;color:var(--ink3);line-height:1.55}
  .hide{display:none!important}
  #login{max-width:400px;margin:9vh auto;padding:0 16px}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h2>Contratti Sponsor JC21</h2>
    <p class="sub">Accesso riservato. I dati non sono leggibili senza autenticazione.</p>
    <div id="l-stato" class="alert w" style="margin-bottom:14px">Avvio in corso\u2026</div>
    <label for="l-mail">Email</label>
    <input id="l-mail" type="email" autocomplete="username" inputmode="email"
           autocapitalize="none" autocorrect="off" spellcheck="false">
    <label for="l-pw">Password</label>
    <input id="l-pw" type="password" autocomplete="current-password"
           autocapitalize="none" autocorrect="off" spellcheck="false">
    <div class="actions"><button class="primary" id="l-go" style="flex:1">Entra</button></div>
    <p class="sub" id="l-err" style="color:var(--st);margin-top:12px"></p>
  </div>
</div>

<div id="app" class="hide">
<header><div class="wrap">
  <div style="flex:1"><h1>Contratti Sponsor JC21<small id="who"></small></h1></div>
  <button class="sm" id="pw">Password</button>
  <button class="sm" id="logout">Esci</button>
</div></header>

<div class="wrap">
  <div class="bar" role="tablist">
    <button class="tab" data-v="agenda" aria-selected="true">Da fare</button>
    <button class="tab" data-v="lista" aria-selected="false">Contratti</button>
    <button class="tab" data-v="report" aria-selected="false">Report</button>
    <button class="tab" data-v="nuovo" aria-selected="false">+ Nuovo</button>
  </div>
  <div id="v-agenda"></div>
  <div id="v-lista"></div>
  <div id="v-report" class="hide"></div>
  <div id="v-nuovo" class="hide"></div>
</div>
</div>

<dialog id="dlg"><div class="dlg">
  <h2 id="dlg-t" style="margin:0 0 12px;font-size:17px"></h2>
  <div id="dlg-c"></div>
  <div class="actions">
    <button class="primary" id="dlg-a"></button>
    <button id="dlg-x">Chiudi</button>
  </div>
</div></dialog>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
        onerror="window.__cdnKo=true"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
        onerror="window.__xlsxKo=true"></script>
<script>
/* qualunque errore imprevisto finisce a schermo, mai pagina bianca */
window.addEventListener('error',ev=>{
  const s=document.getElementById('l-stato');
  if(s){s.className='alert';s.innerHTML='<b>Errore all\u2019avvio</b>'+(ev.message||ev.error||'');}
  document.getElementById('login').classList.remove('hide');
});
</script>
<script>
/* ============ CONFIGURAZIONE ============
   Sostituisci ANON_KEY con la anon key del progetto (Settings > API).
   La anon key da sola non apre nulla: le policy RLS richiedono un utente autenticato. */
const SUPA_URL='https://xqbhujcnjvwbwzpwjujf.supabase.co';
const ANON_KEY='sb_publishable_W2oBnmBorITMgGKEhPEq6g_lHzXiwwj';

let sb=null;
try{ if(window.supabase) sb=window.supabase.createClient(SUPA_URL,ANON_KEY); }catch(e){}
let USER=null, D=[], view='agenda', open=null, editing=null;

const CONTRATTO_JC21='20/07/2026';
const RENDICONTI=['2026-10-20','2027-01-20','2027-04-20','2027-07-20'];
const DISDETTA='2027-04-21';

const TIPI_DOC={
  contratto_firmato:'Contratto firmato',
  proposta_firmata:'Proposta firmata',
  allegato_tecnico:'Allegati e modalit\u00e0 di esecuzione',
  corrispondenza:'Corrispondenza e PEC',
  fattura:'Fatture e contabilit\u00e0',
  altro:'Altri documenti'
};

const ADEMPIMENTI=[
  ['pec_allegato_b','PEC di inserimento in Allegato B','art. 4.2 — crea la presunzione di procacciamento'],
  ['contratto_firmato','Contratto firmato caricato in archivio','prova a corredo dell\u2019Allegato B'],
  ['pec_merce','PEC sul criterio di maturazione del cambio merce','artt. 3.1 e 3.6'],
  ['fatt_merce','Provvigione sul cambio merce fatturata','alla compensazione dei crediti reciproci']
];

/* ---------- utilita' ---------- */
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(+n||0);
const it=i=>{if(!i)return'\u2014';const[a,m,g]=String(i).slice(0,10).split('-');return g+'/'+m+'/'+a};
const oggi=()=>new Date().toISOString().slice(0,10);
const gg=i=>Math.round((new Date(String(i).slice(0,10)+'T12:00')-new Date(oggi()+'T12:00'))/864e5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nIt=v=>{const n=parseFloat(String(v??'').replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n};
function dIt(s){const m=String(s).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(!m)return null;
  const g=+m[1],me=+m[2],a=+m[3],d=new Date(a,me-1,g);
  if(d.getMonth()!==me-1||d.getDate()!==g)return null;
  return a+'-'+String(me).padStart(2,'0')+'-'+String(g).padStart(2,'0')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');
  clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
async function sha256(t){
  if(!(window.crypto&&crypto.subtle))return null; /* contesto non sicuro: niente impronta, il resto funziona */
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* importo in lettere: generato dal numero, mai digitato */
const U=['zero','uno','due','tre','quattro','cinque','sei','sette','otto','nove','dieci','undici','dodici',
'tredici','quattordici','quindici','sedici','diciassette','diciotto','diciannove'];
const DEC=['','','venti','trenta','quaranta','cinquanta','sessanta','settanta','ottanta','novanta'];
function inLettere(n){n=Math.round(n);if(n===0)return'zero';
  const p=(x)=>{let s='';
    if(x>=1000){const m=Math.floor(x/1000);s+=(m===1?'mille':p(m)+'mila');x%=1000}
    if(x>=100){const c=Math.floor(x/100);s+=(c===1?'cento':U[c]+'cento');x%=100}
    if(x>=20){const d=Math.floor(x/10),u=x%10;let dd=DEC[d];
      if(u===1||u===8)dd=dd.slice(0,-1);s+=dd+(u?U[u]:'');}
    else if(x>0)s+=U[x];
    return s};
  return p(n)}

const cDen=c=>(+c.importo_denaro||0)*.30, cMer=c=>(+c.importo_merce||0)*.20;
const cTot=c=>cDen(c)+cMer(c);
const rataComm=(c,r)=>{const t=(c.rate||[]).reduce((a,x)=>a+(+x.importo||0),0);
  return t>0?cDen(c)*((+r.importo||0)/t):0};
const ad=(c,k)=>(c.adempimenti||[]).find(a=>a.chiave===k)||{chiave:k,fatto:false};

/* ---------- autenticazione ---------- */
function stato(html,grave){
  const s=document.getElementById('l-stato');
  s.className=grave?'alert':'alert w';s.innerHTML=html;s.classList.remove('hide');
}
async function boot(){
  document.getElementById('login').classList.remove('hide');
  if(!window.supabase||!sb){
    stato('<b>Libreria Supabase non caricata.</b>Controlla la connessione, oppure pubblica il file su GitHub Pages e aprilo da l\u00ec.',1);
    return;
  }
  if(ANON_KEY.startsWith('INCOLLA')){
    stato('<b>Manca la chiave nel file.</b>Apri il file con un editor di testo, cerca sb_publishable_W2oBnmBorITMgGKEhPEq6g_lHzXiwwj e sostituiscila con la publishable key.',1);
    return;
  }
  try{
    const {data,error}=await sb.auth.getSession();
    if(error)throw error;
    if(data.session){USER=data.session.user;await entra();return}
    stato('Pronto. Inserisci email e password.');
  }catch(e){
    stato('<b>Non riesco a contattare Supabase.</b>'+(e.message||e)
      +'<br><span style="font-size:13px">Se stai aprendo il file da disco pu\u00f2 dipendere dal browser: pubblicalo su GitHub Pages e riprova.</span>',1);
  }
}
async function entra(){
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.getElementById('who').textContent=USER.email;
  await carica();
}
document.getElementById('l-go').onclick=async()=>{
  const email=document.getElementById('l-mail').value.trim().toLowerCase();
  const password=document.getElementById('l-pw').value;
  const err=document.getElementById('l-err');err.textContent='';
  if(!email||!password){err.textContent='Compila entrambi i campi.';return}
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){
    err.innerHTML=/invalid login credentials/i.test(error.message||'')
      ? 'Email o password non corrispondono.<br><span style="font-size:13px;color:var(--ink2)">'
        +'Verifica di aver scritto <b>'+esc(email)+'</b> senza errori. Se l\u2019indirizzo \u00e8 giusto, '
        +'la password non \u00e8 quella impostata: fattela reimpostare dall\u2019amministratore.</span>'
      : 'Accesso non riuscito: '+esc(error.message);
    return;
  }
  USER=data.user;await entra();
};
document.getElementById('l-pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('l-go').click()});
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};

document.getElementById('pw').onclick=()=>{
  dlg('Cambia la tua password',
    '<p class="sub">Vale solo per il tuo accesso. Minimo 8 caratteri.</p>'
    +'<label for="pw1">Nuova password</label><input id="pw1" type="password" autocomplete="new-password">'
    +'<label for="pw2">Ripetila</label><input id="pw2" type="password" autocomplete="new-password">'
    +'<div id="pw-msg" class="sub" style="color:var(--st);margin-top:10px"></div>',
    'Aggiorna', async()=>{
      const a=document.getElementById('pw1').value, b=document.getElementById('pw2').value;
      const m=document.getElementById('pw-msg');
      if(a.length<8){m.textContent='Troppo corta: almeno 8 caratteri.';return}
      if(a!==b){m.textContent='Le due password non coincidono.';return}
      const {error}=await sb.auth.updateUser({password:a});
      if(error){m.textContent='Non riuscito: '+error.message;return}
      document.getElementById('dlg').close();toast('Password aggiornata');
    });
};

/* ---------- caricamento ---------- */
async function carica(){
  const {data,error}=await sb.from('contratti_sponsor')
    .select('*, rate:contratti_rate(*), clausole:contratti_clausole(*), adempimenti:contratti_adempimenti(*), documenti:contratti_documenti(*)')
    .order('creato_il',{ascending:false});
  if(error){toast('Errore nel caricamento: '+error.message);return}
  D=(data||[]).map(c=>{
    c.rate=(c.rate||[]).sort((a,b)=>a.data_scadenza<b.data_scadenza?-1:1);
    c.clausole=(c.clausole||[]).sort((a,b)=>a.ordine-b.ordine);
    return c});
  render();
}

/* ---------- adempimenti aperti ---------- */
function agenda(){
  const o=[];
  D.filter(c=>c.stato!=='archiviato').forEach(c=>{
    if(!ad(c,'pec_allegato_b').fatto)o.push({lv:'st',c,t:'PEC di inserimento in Allegato B',
      d:'Senza questa comunicazione la provvigione di '+eur(cTot(c))+' non ha copertura scritta (art. 4.2).',pec:'B'});
    if(c.stato==='bozza')o.push({lv:'wr',c,t:'Contratto ancora in bozza',
      d:'Va congelato quando entrambe le Parti hanno firmato.'});
    if(!ad(c,'contratto_firmato').fatto&&c.stato==='firmato')o.push({lv:'wr',c,
      t:'Copia firmata da caricare in archivio',d:'Nessun documento allegato a questo contratto.'});
    if(+c.importo_merce>0&&!ad(c,'pec_merce').fatto)o.push({lv:'wr',c,
      t:'PEC sul criterio di maturazione del cambio merce',d:'Mette al riparo '+eur(cMer(c))+' dal vuoto dell\u2019art. 3.6.',pec:'M'});
    (c.rate||[]).forEach(r=>{
      if(r.provvigione_fatturata)return;
      const g=gg(r.data_scadenza);
      if(r.incasso_comunicato)o.push({lv:'st',c,t:'Fatturare la provvigione sulla rata del '+it(r.data_scadenza),
        d:eur(rataComm(c,r))+' \u2014 incasso comunicato, la provvigione \u00e8 esigibile (art. 3.6).'});
      else if(g<-5)o.push({lv:'st',c,t:'Rata del '+it(r.data_scadenza)+': incasso non comunicato',
        d:'JuveCaserta doveva comunicarlo entro 5 giorni lavorativi (art. 3.7). Sollecita per iscritto.'});
      else if(g<=0)o.push({lv:'wr',c,t:'Rata del '+it(r.data_scadenza)+': verificare l\u2019incasso',
        d:'Attendi la comunicazione di JuveCaserta (art. 3.7).'});
      else if(g<=10)o.push({lv:'i',c,t:'Rata in scadenza il '+it(r.data_scadenza),
        d:'Tra '+g+' giorni. Provvigione attesa: '+eur(rataComm(c,r))+'.'});
    });
    if(+c.importo_merce>0&&ad(c,'pec_merce').fatto&&!ad(c,'fatt_merce').fatto)
      o.push({lv:'i',c,t:'Provvigione sul cambio merce da fatturare',d:eur(cMer(c))+' alla compensazione dei crediti.'});
  });
  const r=RENDICONTI.find(d=>gg(d)>=-30&&gg(d)<=15);
  if(r)o.push({lv:gg(r)<=0?'wr':'i',t:'Rendiconto trimestrale del '+it(r),
    d:gg(r)<=0?'Scaduto da '+Math.abs(gg(r))+' giorni: richiedilo per iscritto (art. 5.1).'
              :'Tra '+gg(r)+' giorni.'});
  const dd=gg(DISDETTA);
  if(dd<=120&&dd>=-10)o.push({lv:dd<=30?'st':'wr',t:'Termine per la disdetta: '+it(DISDETTA),
    d:'Mancano '+dd+' giorni, poi il contratto si rinnova tacitamente (art. 7.2).'});
  const k={st:0,wr:1,i:2};return o.sort((a,b)=>k[a.lv]-k[b.lv]);
}

/* ---------- viste ---------- */
function vAgenda(){
  const t=agenda();
  const tot=D.reduce((a,c)=>a+cTot(c),0);
  const fat=D.reduce((a,c)=>a+(c.rate||[]).filter(r=>r.provvigione_fatturata).reduce((x,r)=>x+rataComm(c,r),0)
    +(ad(c,'fatt_merce').fatto?cMer(c):0),0);
  let h='<div class="kpis">'
    +'<div class="kpi"><b class="num">'+D.length+'</b><span>contratti</span></div>'
    +'<div class="kpi"><b class="num">'+eur(tot)+'</b><span>provvigioni maturate</span></div>'
    +'<div class="kpi"><b class="num">'+eur(fat)+'</b><span>gi\u00e0 fatturate</span></div>'
    +'<div class="kpi"><b class="num">'+eur(tot-fat)+'</b><span>da fatturare</span></div></div>';
  if(!D.length)return h+'<div class="card"><div class="empty"><b>Nessun contratto.</b><br>'
    +'Apri <b>+ Nuovo</b> per crearne uno: potrai modificarne ogni parte finch\u00e9 resta in bozza.</div></div>';
  h+='<div class="card"><h2>Cosa fare adesso</h2>';
  if(!t.length)return h+'<div class="empty">Tutto in regola.</div></div>';
  h+='<p class="sub">'+t.length+' voci aperte, dalla pi\u00f9 urgente.</p>';
  t.forEach(x=>{
    h+='<div class="alert'+(x.lv==='st'?'':x.lv==='wr'?' w':' i')+'"><b>'+esc(x.t)+'</b>'
      +(x.c?'<span style="color:var(--ink2)">'+esc(x.c.sponsor_nome)+' \u2014 </span>':'')+esc(x.d);
    if(x.pec)h+='<div class="actions"><button class="sm primary" data-pec="'+x.pec+'" data-id="'+x.c.id+'">Genera la PEC</button></div>';
    h+='</div>';
  });
  return h+'</div>';
}

function vLista(){
  if(!D.length)return '<div class="card"><div class="empty">Nessun contratto.</div></div>';
  let h='';
  D.forEach(c=>{
    const st=c.stato==='bozza'?'<span class="pill p-mu">bozza</span>'
      :c.stato==='firmato'?'<span class="pill p-ok">firmato</span>':'<span class="pill p-mu">archiviato</span>';
    h+='<div class="it"><div class="it-h" data-open="'+c.id+'"><div style="flex:1;min-width:0">'
      +'<b>'+esc(c.sponsor_nome)+'</b><div class="m">'+esc(c.numero||'senza numero')+' \u00b7 '+esc(c.qualifica||'')
      +' \u00b7 provvigione <b class="num">'+eur(cTot(c))+'</b></div></div>'+st+'</div>';
    if(open===c.id)h+='<div class="it-b">'+dettaglio(c)+'</div>';
    h+='</div>';
  });
  return h;
}

function dettaglio(c){
  const bloc=c.stato!=='bozza';
  let h='';
  if(bloc)h+='<div class="lock"><b>Contratto congelato.</b> Firmato il '+it(c.firmato_il)
    +'. Il database rifiuta qualsiasi modifica: per cambiare qualcosa serve un atto integrativo.'
    +(c.testo_hash?'<br><span style="font-size:12px;opacity:.8">Impronta SHA-256: '+esc(c.testo_hash.slice(0,32))+'\u2026</span>':'')+'</div>';

  h+='<h3>Controparte</h3>'
    +'<div class="rw"><div class="d">'+esc(c.sponsor_rappresentante||'\u2014')
    +'<span>'+esc(c.sponsor_piva||'P.IVA non indicata')+' \u00b7 '+esc(c.sponsor_pec||'PEC non indicata')+'</span></div></div>'
    +'<h3>Economia</h3>'
    +'<div class="rw"><div class="d">Denaro '+eur(c.importo_denaro)+' \u00b7 30%<span>art. 3.1</span></div><b class="num">'+eur(cDen(c))+'</b></div>'
    +'<div class="rw"><div class="d">Cambio merce '+eur(c.importo_merce)+' \u00b7 20%<span>art. 3.1, valore normale</span></div><b class="num">'+eur(cMer(c))+'</b></div>';

  h+='<h3>Adempimenti</h3>';
  ADEMPIMENTI.forEach(([k,t,d])=>{
    if(k==='pec_merce'&&!(+c.importo_merce>0))return;
    if(k==='fatt_merce'&&!(+c.importo_merce>0))return;
    const a=ad(c,k);
    h+='<label class="chk'+(a.fatto?' done':'')+'"><input type="checkbox" data-ad="'+k+'" data-id="'+c.id+'"'
      +(a.fatto?' checked':'')+'><span class="t">'+t+'<small>'+d+(a.fatto&&a.fatto_il?' \u00b7 fatto il '+it(a.fatto_il):'')+'</small></span></label>';
  });
  h+='<div class="actions"><button class="sm" data-pec="B" data-id="'+c.id+'">PEC Allegato B</button>';
  if(+c.importo_merce>0)h+='<button class="sm" data-pec="M" data-id="'+c.id+'">PEC cambio merce</button>';
  h+='</div>';

  if((c.rate||[]).length){
    h+='<h3>Rate e provvigioni</h3>';
    c.rate.forEach(r=>{
      const s=r.provvigione_fatturata?'<span class="pill p-ok">fatturata</span>'
        :r.incasso_comunicato?'<span class="pill p-wr">da fatturare</span>'
        :gg(r.data_scadenza)<0?'<span class="pill p-st">incasso da verificare</span>':'<span class="pill p-mu">attesa</span>';
      h+='<div class="rw"><div class="d">'+it(r.data_scadenza)+' \u00b7 '+eur(r.importo)
        +'<span>provvigione '+eur(rataComm(c,r))+'</span></div>'+s+'</div>'
        +'<div class="actions" style="margin:2px 0 8px">'
        +'<button class="sm" data-rt="inc" data-r="'+r.id+'" data-id="'+c.id+'">'
        +(r.incasso_comunicato?'\u2713 incasso comunicato':'segna incasso comunicato')+'</button>'
        +'<button class="sm" data-rt="fat" data-r="'+r.id+'" data-id="'+c.id+'"'+(r.incasso_comunicato?'':' disabled')+'>'
        +(r.provvigione_fatturata?'\u2713 provvigione fatturata':'segna provvigione fatturata')+'</button></div>';
    });
  }

  h+='<h3>Testo del contratto</h3>';
  if(bloc){
    h+='<p class="sub">'+(c.clausole||[]).length+' clausole congelate. Sola lettura.</p>'
      +'<div class="actions"><button class="sm" data-testo="'+c.id+'">Leggi il testo</button></div>';
  }else{
    h+='<p class="sub">'+(c.clausole||[]).length+' clausole. Puoi riscrivere, spostare, aggiungere o eliminare qualunque parte: '
      +'la numerazione e i richiami si ricalcolano da soli.</p>'
      +'<div class="actions"><button class="sm primary" data-edit="'+c.id+'">Modifica il testo</button>'
      +'<button class="sm" data-testo="'+c.id+'">Anteprima</button></div>';
  }

  h+='<h3>Documenti generati</h3>'
    +'<p class="sub">Escono impaginati e pronti da stampare o salvare in PDF.</p>'
    +'<div class="actions"><button class="sm" data-doc="proposta" data-id="'+c.id+'">Genera la proposta</button>'
    +'<button class="sm" data-doc="contratto" data-id="'+c.id+'">Genera il contratto</button></div>';

  h+='<h3>Documenti archiviati</h3>';
  const docs=(c.documenti||[]);
  if(docs.length){
    const grp={};
    docs.forEach(d=>{const k=d.tipo||'altro';(grp[k]=grp[k]||[]).push(d)});
    Object.keys(TIPI_DOC).filter(k=>grp[k]).forEach(k=>{
      h+='<div style="font-size:12.5px;font-weight:650;color:var(--ink3);margin:12px 0 2px">'
        +esc(TIPI_DOC[k])+'</div>';
      grp[k].forEach(d=>h+='<div class="rw"><div class="d">'+esc(d.nome_file)
        +'<span>'+it(d.caricato_il)+' \u00b7 '+esc(d.caricato_da||'')
        +(d.dimensione?' \u00b7 '+Math.round(d.dimensione/1024)+' KB':'')+'</span></div>'
        +'<button class="sm" data-scarica="'+esc(d.percorso)+'">Apri</button></div>');
    });
  }else h+='<p class="sub">Nessun documento caricato. Qui puoi archiviare il contratto firmato, la proposta, gli allegati sulle modalit\u00e0 di esecuzione e la corrispondenza.</p>';
  h+='<div class="actions"><button class="sm primary" data-up="'+c.id+'">Carica un documento</button></div>';

  h+='<div class="actions" style="border-top:1px solid var(--line);padding-top:14px;margin-top:16px">';
  if(!bloc)h+='<button class="ok" data-firma="'+c.id+'">Congela come firmato</button>'
    +'<button class="danger sm" data-del="'+c.id+'">Elimina bozza</button>';
  else h+='<button class="sm" data-integr="'+c.id+'">Crea atto integrativo</button>';
  h+='</div>';
  return h;
}

function componiTesto(c){
  const cl=(c.clausole||[]);
  let t='CONTRATTO DI SPONSORIZZAZIONE\n\nTRA\n\n'
   +'Juvecaserta 2021 S.S.D. a R.L., con sede in viale Cappiello 50, 81100 Caserta (CE), P.IVA 04571060617,\n'
   +'in persona del legale rappresentante pro tempore (la \u201cJC\u201d)\n\nE\n\n'
   +(c.sponsor_nome||'')+(c.sponsor_sede?', con sede in '+c.sponsor_sede:'')
   +(c.sponsor_piva?', Partita IVA '+c.sponsor_piva:'')+(c.sponsor_pec?', PEC '+c.sponsor_pec:'')+',\n'
   +'in persona del legale rappresentante pro tempore'
   +(c.sponsor_rappresentante?' il sig. '+c.sponsor_rappresentante:'')
   +(c.sponsor_nato_a?', nato a '+c.sponsor_nato_a+(c.sponsor_nato_il?' il '+it(c.sponsor_nato_il):''):'')
   +' (lo \u201cSPONSOR\u201d)\n\n';
  cl.forEach((x,i)=>{t+='\n'+(i+1)+'. '+(x.titolo||'').toUpperCase()+'\n'+(x.corpo||'')+'\n'});
  const v=cl.map((x,i)=>({n:i+1,x})).filter(o=>o.x.vessatoria);
  if(v.length){
    t+='\n\nAPPROVAZIONE SPECIFICA DI CLAUSOLE EX ARTT. 1341 E 1342 COD. CIV.\n\n'
     +'Ai sensi e per gli effetti degli artt. 1341 e 1342 cod. civ., lo SPONSOR dichiara di aver letto '
     +'attentamente e di approvare specificamente le seguenti clausole: '
     +v.map(o=>'art. '+o.n+(o.x.titolo?' ('+o.x.titolo.toLowerCase()+')':'')).join('; ')+'.\n\n'
     +'________________________          ________________________\n';
  }
  return t;
}

/* ---------- PEC ---------- */
function pecTesto(c,k){
  if(k==='B')return `Oggetto: Contratto di collaborazione commerciale del ${CONTRATTO_JC21} — art. 4.2 — aggiornamento dell'Allegato B — sponsor ${c.sponsor_nome}

Spett.le
Juvecaserta 2021 S.S.D. a R.L.

ai sensi e per gli effetti dell'art. 4.2 del contratto di collaborazione commerciale sottoscritto tra le Parti in data ${CONTRATTO_JC21}, si documenta la presentazione a codesta Società del seguente sponsor, procacciato da Ottantunocento:

— Denominazione: ${c.sponsor_nome}
— Partita IVA: ${c.sponsor_piva||'—'}
— Data di presentazione: ${it(c.data_presentazione)}
— Qualifica: ${c.qualifica||'—'}
— Corrispettivo in denaro: ${eur(c.importo_denaro)} oltre IVA
— Corrispettivo in cambio merce: ${eur(c.importo_merce)} oltre IVA

La presente vale quale aggiornamento dell'Elenco Sponsor di cui all'Allegato B, con conseguente presunzione di procacciamento in favore di Ottantunocento e diritto alle commissioni di cui all'art. 3.1.

Distinti saluti

Ottantunocento`;
  return `Oggetto: Contratto di collaborazione commerciale del ${CONTRATTO_JC21} — artt. 3.1 e 3.6 — maturazione della commissione sulla quota in cambio merce — sponsor ${c.sponsor_nome}

Spett.le
Juvecaserta 2021 S.S.D. a R.L.

con riferimento alla sponsorizzazione conclusa con ${c.sponsor_nome}, il cui corrispettivo è assolto quanto a ${eur(c.importo_merce)} oltre IVA mediante cambio merce, si rappresenta quanto segue.

L'art. 3.1 riconosce a Ottantunocento una commissione del 20% sulle sponsorizzazioni in cambio merce, calcolata sul valore normale dei beni o servizi. L'art. 3.6 disciplina la maturazione facendo riferimento all'incasso, fattispecie che nella permuta non ricorre, estinguendosi i crediti reciproci per compensazione.

Poiché l'art. 1367 cod. civ. impone di interpretare le clausole nel senso in cui possono avere qualche effetto, le Parti concordano che la commissione si intende maturata, ed è fatturabile, alla data di emissione della fattura dello sponsor per le prestazioni rese e comunque all'atto della compensazione dei crediti reciproci.

Ove codesta Società non ritenga di condividere quanto precede, si prega di darne riscontro scritto entro 15 giorni; in difetto il criterio si intenderà accettato.

Distinti saluti

Ottantunocento`;
}

/* Su iPhone Safari blocca spesso le finestre nuove: se succede, il documento
   viene mostrato dentro la pagina e stampato da li'. */
function prefissa(css,sel){
  return css.replace(/(^|\})\s*([^@{}]+)\{/g,(m,chiusa,selettori)=>
    chiusa+selettori.split(',').map(s=>{
      s=s.trim();
      if(!s)return s;
      if(/^body$/i.test(s))return sel;
      return sel+' '+s;
    }).join(',')+'{');
}
function apriStampa(titolo,stile,corpo){
  const w=window.open('','_blank');
  if(w){
    w.document.write(`<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>${esc(titolo)}</title><style>${stile}</style></head><body>
      <button class="nostampa" onclick="window.print()">Stampa o salva in PDF</button>
      ${corpo}</body></html>`);
    w.document.close();
    return;
  }
  /* ripiego: sovrapposizione dentro la pagina */
  document.getElementById('doc-overlay')?.remove();
  const page=(stile.match(/@page\{[^}]*\}/)||[''])[0];
  const resto=stile.replace(/@page\{[^}]*\}/,'').replace(/@media print\{[^}]*\}/g,'');
  const ov=document.createElement('div');
  ov.id='doc-overlay';
  ov.innerHTML=`<style>
    ${page}
    #doc-overlay{position:fixed;inset:0;background:#fff;z-index:200;overflow:auto;padding:18px 16px 90px}
    ${prefissa(resto,'#doc-body')}
    #doc-body{max-width:760px;margin:0 auto}
    #doc-barra{position:fixed;left:0;right:0;bottom:0;background:#14181F;padding:12px;
      display:flex;gap:8px;justify-content:center;z-index:201}
    #doc-barra button{min-height:44px;padding:12px 18px;border:0;border-radius:9px;
      font:600 15px/1 -apple-system,sans-serif;cursor:pointer}
    @media print{
      body>*:not(#doc-overlay){display:none!important}
      #doc-overlay{position:static;padding:0;overflow:visible}
      #doc-barra{display:none!important}
    }</style>
    <div id="doc-body">${corpo}</div>
    <div id="doc-barra">
      <button style="background:#1B4D8F;color:#fff" onclick="window.print()">Stampa o salva in PDF</button>
      <button style="background:#fff;color:#14181F" onclick="document.getElementById('doc-overlay').remove()">Chiudi</button>
    </div>`;
  document.body.appendChild(ov);
  ov.scrollTop=0;
}

    delle attivit&agrave; sportive dilettantistiche, che la soglia annua non sia superata, che il contratto abbia
    finalit&agrave; promozionale esplicita e che l'attivit&agrave; promozionale sia effettivamente svolta e documentata.`;

function righeReport(){
  return D.map(c=>{
    const inc=(c.rate||[]).filter(r=>r.incasso_comunicato).reduce((a,r)=>a+(+r.importo||0),0);
    const fatt=(c.rate||[]).filter(r=>r.provvigione_fatturata).reduce((a,r)=>a+rataComm(c,r),0)
      +(ad(c,'fatt_merce').fatto?cMer(c):0);
    return {numero:c.numero||'(bozza)',sponsor:c.sponsor_nome,qualifica:c.qualifica||'',
      stato:c.stato,firmato:c.firmato_il?it(c.firmato_il):'',
      denaro:+c.importo_denaro||0,merce:+c.importo_merce||0,
      totale:(+c.importo_denaro||0)+(+c.importo_merce||0),
      provvigione:cTot(c),incassato:inc,fatturata:fatt,daFatturare:cTot(c)-fatt,
      allegatoB:ad(c,'pec_allegato_b').fatto?'si':'NO'};
  });
}

function vReport(){
  const r=righeReport();
  if(!r.length)return '<div class="card"><div class="empty">Nessun contratto da riportare.</div></div>';
  const den=r.filter(x=>x.denaro>0), mer=r.filter(x=>x.merce>0);
  const totDen=den.reduce((a,x)=>a+x.denaro,0), totMer=mer.reduce((a,x)=>a+x.merce,0);
  const provDen=totDen*.30, provMer=totMer*.20;

  let h='<div class="kpis">'
   +'<div class="kpi"><b class="num">'+eur(totDen+totMer)+'</b><span>valore del portafoglio</span></div>'
   +'<div class="kpi"><b class="num">'+eur(provDen+provMer)+'</b><span>provvigioni maturate</span></div>'
   +'<div class="kpi"><b class="num">'+(totDen+totMer?Math.round(totMer/(totDen+totMer)*100):0)+'%</b><span>quota in cambio merce</span></div>'
   +'<div class="kpi"><b class="num">'+eur(r.reduce((a,x)=>a+x.daFatturare,0))+'</b><span>da fatturare</span></div></div>'
   +'<div class="card"><div class="actions" style="margin:0">'
   +'<button class="primary" id="exp-pdf">Esporta in PDF</button>'
   +'<button id="exp-xls">Esporta in Excel</button></div></div>';

  const sez=(titolo,nota,righe,campo,perc,tot)=>{
    if(!righe.length)return '';
    let b='<div class="card"><h2>'+titolo+'</h2><p class="sub">'+nota+'</p>';
    righe.forEach(x=>{
      b+='<div class="rw"><div class="d"><b>'+esc(x.sponsor)+'</b>'
        +'<span>'+esc(x.numero)+' \u00b7 '+esc(x.qualifica)
        +(x.allegatoB==='NO'?' \u00b7 <b style="color:var(--st)">Allegato B da fare</b>':'')+'</span></div>'
        +'<div style="text-align:right"><b class="num">'+eur(x[campo]*perc)+'</b>'
        +'<span style="display:block;font-size:12px;color:var(--ink3)">su '+eur(x[campo])+'</span></div></div>';
    });
    b+='<div class="rw" style="border-top:2px solid var(--line);border-bottom:0">'
      +'<div class="d"><b>Totale</b><span>'+righe.length+' contratti</span></div>'
      +'<div style="text-align:right"><b class="num" style="font-size:17px">'+eur(tot*perc)+'</b>'
      +'<span style="display:block;font-size:12px;color:var(--ink3)">su '+eur(tot)+'</span></div></div>';
    return b+'</div>';
  };

  h+=sez('Sponsorizzazioni in denaro',
     'Provvigione del 30% ai sensi dell\u2019art. 3.1. Matura a ogni incasso comunicato da JuveCaserta.',
     den,'denaro',.30,totDen);
  h+=sez('Sponsorizzazioni in cambio merce',
     'Provvigione del 20% sul valore normale dei beni o servizi. Matura alla compensazione dei crediti reciproci.',
     mer,'merce',.20,totMer);

  if(totMer>0&&totDen>0){
    const dovuto=provDen+provMer;
    h+='<div class="card"><h2>Equilibrio di cassa</h2>'
     +'<p class="sub">Le provvigioni si pagano in denaro anche quando la sponsorizzazione \u00e8 in merce.</p>'
     +'<div class="rw"><div class="d">Incasso in denaro atteso da JuveCaserta</div><b class="num">'+eur(totDen)+'</b></div>'
     +'<div class="rw"><div class="d">Provvigioni dovute a Ottantunocento</div><b class="num">'+eur(dovuto)+'</b></div>'
     +'<div class="rw" style="border-bottom:0"><div class="d">Incidenza sulle entrate in denaro'
     +'<span>oltre all\u2019IVA che JC21 versa sull\u2019intero imponibile</span></div>'
     +'<b class="num">'+Math.round(dovuto/totDen*100)+'%</b></div></div>';
  }
  return h;
}
function esportaExcel(){

  const r=righeReport();

  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.map(x=>({
    'Numero':x.numero,'Sponsor':x.sponsor,'Qualifica':x.qualifica,'Stato':x.stato,
    'Firmato il':x.firmato,'Denaro':x.denaro,'Cambio merce':x.merce,'Totale':x.totale,
    'Provvigione':x.provvigione,'Gia fatturata':x.fatturata,'Da fatturare':x.daFatturare,
    'PEC Allegato B':x.allegatoB}))),'Contratti');
  const rate=[];
  D.forEach(c=>(c.rate||[]).forEach(x=>rate.push({
    'Sponsor':c.sponsor_nome,'Scadenza':it(x.data_scadenza),'Importo rata':+x.importo||0,
    'Provvigione':Math.round(rataComm(c,x)*100)/100,
    'Incasso comunicato':x.incasso_comunicato?'si':'no',
    'Provvigione fatturata':x.provvigione_fatturata?'si':'no'})));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rate),'Rate e provvigioni');
  const split=[];
  r.filter(x=>x.denaro>0).forEach(x=>split.push({'Tipo':'Denaro','Sponsor':x.sponsor,
    'Qualifica':x.qualifica,'Imponibile':x.denaro,'Aliquota':'30%',
    'Provvigione':Math.round(x.denaro*30)/100}));
  r.filter(x=>x.merce>0).forEach(x=>split.push({'Tipo':'Cambio merce','Sponsor':x.sponsor,
    'Qualifica':x.qualifica,'Imponibile':x.merce,'Aliquota':'20%',
    'Provvigione':Math.round(x.merce*20)/100}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(split),'Denaro e cambio merce');
  const ade=[];
  D.forEach(c=>ADEMPIMENTI.forEach(([k,t])=>ade.push({
    'Sponsor':c.sponsor_nome,'Adempimento':t,
    'Fatto':ad(c,k).fatto?'si':'no','Data':ad(c,k).fatto_il?it(ad(c,k).fatto_il):''})));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ade),'Adempimenti');
  XLSX.writeFile(wb,'Report_contratti_JC21_'+oggi()+'.xlsx');
  toast('Excel scaricato');
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('button,.it-h');if(!t)return;
  const c=t.dataset.id?D.find(x=>x.id===t.dataset.id):null;

  if(t.classList.contains('tab')){view=t.dataset.v;render();scrollTo(0,0);return}
  if(t.classList.contains('it-h')){open=open===t.dataset.open?null:t.dataset.open;render();return}

  if(t.dataset.pec){
    const txt=pecTesto(c,t.dataset.pec);
    dlg('PEC pronta da copiare','<pre>'+esc(txt)+'</pre>','Copia il testo',async()=>{
      try{await navigator.clipboard.writeText(txt);toast('Testo copiato')}catch(x){toast('Selezionalo e copialo a mano')}
    });return}

  if(t.dataset.testo){
    const cc=D.find(x=>x.id===t.dataset.testo);
    const txt=cc.stato==='bozza'?componiTesto(cc):(cc.testo_congelato||componiTesto(cc));
    dlg('Testo del contratto','<pre>'+esc(txt)+'</pre>','Copia',async()=>{
      try{await navigator.clipboard.writeText(txt);toast('Copiato')}catch(x){}});return}

  if(t.dataset.edit){editing=t.dataset.edit;const cc=D.find(x=>x.id===editing);
    dlg('Modifica il testo \u2014 '+cc.sponsor_nome,editor(cc),'Salva le modifiche',salvaClausole);return}

  if(t.dataset.mv){
    const box=t.closest('.cl'),list=document.getElementById('cl-list');
    if(t.dataset.mv==='del'){if(confirm('Eliminare questa clausola?'))box.remove()}
    else if(t.dataset.mv==='su'&&box.previousElementSibling)list.insertBefore(box,box.previousElementSibling);
    else if(t.dataset.mv==='giu'&&box.nextElementSibling)list.insertBefore(box.nextElementSibling,box);
    [...list.children].forEach((b,i)=>{b.querySelector('.cl-n').textContent=i+1;
      b.querySelector('[data-mv=su]').disabled=i===0;
      b.querySelector('[data-mv=giu]').disabled=i===list.children.length-1});
    return}

  if(t.id==='cl-add'){
    const list=document.getElementById('cl-list'),i=list.children.length;
    const d=document.createElement('div');d.className='cl';d.dataset.k='cl_'+Date.now().toString(36);
    d.innerHTML='<div class="cl-h"><div class="cl-n">'+(i+1)+'</div>'
      +'<input type="text" class="cl-t" placeholder="Titolo dell\u2019articolo">'
      +'<div class="mv"><button data-mv="su">\u2191</button><button data-mv="giu" disabled>\u2193</button>'
      +'<button data-mv="del" class="danger">\u00d7</button></div></div>'
      +'<textarea class="cl-c" placeholder="Testo della clausola"></textarea>'
      +'<label class="chk" style="padding-bottom:0"><input type="checkbox" class="cl-v">'
      +'<span class="t" style="font-size:14px">Clausola da approvare ex artt. 1341-1342 c.c.</span></label>';
    list.appendChild(d);
    if(i>0)list.children[i-1].querySelector('[data-mv=giu]').disabled=false;
    d.querySelector('.cl-t').focus();return}

  if(t.dataset.rt){
    const r=c.rate.find(x=>x.id===t.dataset.r);
    const p=t.dataset.rt==='inc'
      ?{incasso_comunicato:!r.incasso_comunicato,incasso_data:!r.incasso_comunicato?oggi():null,
        provvigione_fatturata:!r.incasso_comunicato?r.provvigione_fatturata:false}
      :{provvigione_fatturata:!r.provvigione_fatturata};
    const {error}=await sb.from('contratti_rate').update(p).eq('id',r.id);
    if(error)return toast('Errore: '+error.message);
    await log(c.id,'rata',{rata:r.data_scadenza,...p});await carica();return}

  if(t.dataset.firma){await congela(D.find(x=>x.id===t.dataset.firma));return}
  if(t.dataset.up){caricaFile(D.find(x=>x.id===t.dataset.up));return}
  if(t.dataset.scarica){
    const {data,error}=await sb.storage.from('contratti').createSignedUrl(t.dataset.scarica,120);
    if(error)return toast('Errore: '+error.message);
    window.open(data.signedUrl,'_blank');return}

  if(t.dataset.del){
    const cc=D.find(x=>x.id===t.dataset.del);
    if(!confirm('Eliminare la bozza di '+cc.sponsor_nome+'?'))return;
    const {error}=await sb.from('contratti_sponsor').delete().eq('id',cc.id);
    if(error)return toast('Errore: '+error.message);
    open=null;toast('Bozza eliminata');await carica();return}

  if(t.dataset.integr){
    const o=D.find(x=>x.id===t.dataset.integr);
    const {data,error}=await sb.from('contratti_sponsor').insert({
      numero:null,sponsor_nome:o.sponsor_nome+' \u2014 atto integrativo',sponsor_piva:o.sponsor_piva,
      sponsor_pec:o.sponsor_pec,sponsor_rappresentante:o.sponsor_rappresentante,sponsor_sede:o.sponsor_sede,
      qualifica:o.qualifica,stagione:o.stagione,note:'Integrativa del contratto '+(o.numero||''),
      creato_da:USER.email}).select().single();
    if(error)return toast('Errore: '+error.message);
    toast('Atto integrativo creato in bozza');open=data.id;view='lista';await carica();return}

  if(t.id==='exp-xls'){esportaExcel();return}
  if(t.id==='exp-pdf'){esportaPdf();return}
  if(t.dataset.doc){
    const cc=D.find(x=>x.id===t.dataset.id);
    if(t.dataset.doc==='proposta')generaProposta(cc); else generaContratto(cc);
    return}
  if(t.id==='n-save'){await nuovo();return}
  if(t.id==='dlg-x'){document.getElementById('dlg').close();return}
});

document.addEventListener('change',async e=>{
  const k=e.target.closest('input[data-ad]');if(!k)return;
  const c=D.find(x=>x.id===k.dataset.id);
  const {error}=await sb.from('contratti_adempimenti').upsert({
    contratto_id:c.id,chiave:k.dataset.ad,fatto:k.checked,
    fatto_il:k.checked?oggi():null,fatto_da:k.checked?USER.email:null},{onConflict:'contratto_id,chiave'});
  if(error)return toast('Errore: '+error.message);
  await log(c.id,'adempimento',{chiave:k.dataset.ad,fatto:k.checked});await carica();
});

function dlg(titolo,html,azione,fn){
  document.getElementById('dlg-t').textContent=titolo;
  document.getElementById('dlg-c').innerHTML=html;
  const b=document.getElementById('dlg-a');
  b.textContent=azione||'';b.classList.toggle('hide',!azione);b.onclick=fn||null;
  document.getElementById('dlg').showModal();
}

async function salvaClausole(){
  const c=D.find(x=>x.id===editing);
  const boxes=[...document.querySelectorAll('#cl-list .cl')];
  const nuove=boxes.map((b,i)=>({contratto_id:c.id,chiave:b.dataset.k,ordine:i+1,
    titolo:b.querySelector('.cl-t').value.trim(),corpo:b.querySelector('.cl-c').value,
    vessatoria:b.querySelector('.cl-v').checked}));
  const del=await sb.from('contratti_clausole').delete().eq('contratto_id',c.id);
  if(del.error)return toast('Errore: '+del.error.message);
  if(nuove.length){
    const ins=await sb.from('contratti_clausole').insert(nuove);
    if(ins.error)return toast('Errore: '+ins.error.message);
  }
  await log(c.id,'clausole',{clausole:nuove.map(n=>({k:n.chiave,t:n.titolo,c:n.corpo}))});
  document.getElementById('dlg').close();toast('Testo salvato');await carica();
}

async function congela(c){
  const p=[];
  if(!(c.clausole||[]).length)p.push('Il contratto non ha clausole.');
  const somma=(c.rate||[]).reduce((a,r)=>a+(+r.importo||0),0);
  if((c.rate||[]).length&&Math.abs(somma-(+c.importo_denaro||0))>0.01)
    p.push('La somma delle rate ('+eur(somma)+') non corrisponde all\u2019importo in denaro ('+eur(c.importo_denaro)+').');
  if(+c.importo_merce>0&&!c.merce_quantita_max)
    p.push('Il cambio merce non ha un tetto quantitativo: senza limite l\u2019obbligazione \u00e8 indeterminata.');
  if(!c.sponsor_piva||c.sponsor_piva.length!==11)p.push('Partita IVA mancante o di lunghezza errata.');
  if(!c.sponsor_rappresentante)p.push('Manca il legale rappresentante dello sponsor.');
  if(p.length){
    dlg('Non posso congelarlo','<div class="alert"><b>Correggi prima questi punti</b>'
      +p.map(x=>'<div style="margin-top:6px">\u2022 '+esc(x)+'</div>').join('')+'</div>',null,null);
    return;
  }
  const data=prompt('Data della firma (gg/mm/aaaa):',new Date().toLocaleDateString('it-IT'));
  if(!data)return;
  const iso=dIt(data);
  if(!iso)return toast('Data non valida o inesistente');
  if(!confirm('Congelare il contratto?\n\nDopo la firma il database rifiuter\u00e0 qualsiasi modifica: '
    +'per cambiare qualcosa servir\u00e0 un atto integrativo.'))return;
  const testo=componiTesto(c);
  const hash=await sha256(testo);
  let numero=c.numero;
  if(!numero){
    const {data:n}=await sb.rpc('prossimo_numero_contratto');
    numero=n||('CONTR-'+new Date().getFullYear()+'-'+Date.now().toString().slice(-3));
  }
  const {error}=await sb.from('contratti_sponsor').update({
    stato:'firmato',numero,firmato_il:iso,firmato_da:USER.email,
    testo_congelato:testo,testo_hash:hash,congelato_il:new Date().toISOString()}).eq('id',c.id);
  if(error)return toast('Errore: '+error.message);
  await log(c.id,'congelamento',{numero,hash,firmato_il:iso});
  toast('Congelato \u2014 '+numero);await carica();
}

function caricaFile(c){
  dlg('Carica un documento \u2014 '+c.sponsor_nome,
    '<label for="up-tipo">Tipo di documento</label><select id="up-tipo">'
    +Object.keys(TIPI_DOC).map(k=>'<option value="'+k+'">'+TIPI_DOC[k]+'</option>').join('')
    +'</select><p class="sub" style="margin-top:10px">Accetta PDF, immagini e documenti Word. '
    +'Il file viene archiviato in uno spazio riservato: si apre solo da qui, con un collegamento temporaneo.</p>',
    'Scegli il file', ()=>{
      const tipo=document.getElementById('up-tipo').value;
      document.getElementById('dlg').close();
      scegliFile(c,tipo);
    });
}
async function scegliFile(c,tipo){
  const inp=document.createElement('input');inp.type='file';
  inp.accept='application/pdf,image/*,.docx';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    toast('Caricamento in corso\u2026');
    let hash=null;
    if(window.crypto&&crypto.subtle){
      const buf=await f.arrayBuffer();
      hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))]
        .map(x=>x.toString(16).padStart(2,'0')).join('');
    }
    const path=c.id+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_');
    const {error}=await sb.storage.from('contratti').upload(path,f,{upsert:false});
    if(error)return toast('Caricamento non riuscito: '+error.message);
    const {error:e2}=await sb.from('contratti_documenti').insert({contratto_id:c.id,percorso:path,
      nome_file:f.name,dimensione:f.size,sha256:hash,tipo:tipo,caricato_da:USER.email});
    if(e2)return toast('Errore: '+e2.message);
    if(tipo==='contratto_firmato')
      await sb.from('contratti_adempimenti').upsert({contratto_id:c.id,chiave:'contratto_firmato',
        fatto:true,fatto_il:oggi(),fatto_da:USER.email},{onConflict:'contratto_id,chiave'});
    await log(c.id,'documento',{file:f.name,tipo,hash});
    toast('Documento archiviato');await carica();
  };
  inp.click();
}

async function nuovo(){
  const nome=document.getElementById('n-nome').value.trim();
  if(!nome){toast('Manca la denominazione');return}
  const denaro=nIt(document.getElementById('n-den').value),merce=nIt(document.getElementById('n-mer').value);
  if(!denaro&&!merce){toast('Indica almeno un importo');return}
  const raw=document.getElementById('n-rate').value.split(',').map(x=>x.trim()).filter(Boolean);
  const bad=raw.find(x=>!dIt(x));
  if(bad){toast('Data non valida o inesistente: '+bad);return}
  const iso=raw.map(dIt).sort();
  const {data,error}=await sb.from('contratti_sponsor').insert({
    sponsor_nome:nome,sponsor_piva:document.getElementById('n-piva').value.trim()||null,
    sponsor_pec:document.getElementById('n-pec').value.trim()||null,
    sponsor_rappresentante:document.getElementById('n-rapp').value.trim()||null,
    qualifica:document.getElementById('n-qual').value,data_presentazione:oggi(),
    importo_denaro:denaro,importo_merce:merce,
    merce_quantita_max:parseInt(document.getElementById('n-mq').value)||null,
    merce_valore_unitario:nIt(document.getElementById('n-mu').value)||null,
    creato_da:USER.email}).select().single();
  if(error)return toast('Errore: '+error.message);
  if(iso.length){
    const q=Math.round(denaro/iso.length*100)/100;
    await sb.from('contratti_rate').insert(iso.map((d,i)=>({contratto_id:data.id,data_scadenza:d,
      importo:i===iso.length-1?Math.round((denaro-q*(iso.length-1))*100)/100:q})));
  }
  await log(data.id,'creazione',{sponsor:nome,denaro,merce});
  toast('Bozza creata. Ora scrivi il testo e manda la PEC.');
  open=data.id;view='lista';await carica();
}

boot();
</script>
